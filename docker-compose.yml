services:
  caddy:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ghcr.io/spotibay/web:latest
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_ADDRESS: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:2019/config/']
      interval: 15s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ghcr.io/spotibay/api:latest
    restart: unless-stopped
    mem_limit: 384m
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      APP_URL: ${APP_URL}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      RECOVERY_HMAC_SECRET: ${RECOVERY_HMAC_SECRET:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    mem_limit: 384m
    command: ['postgres', '-c', 'shared_buffers=128MB', '-c', 'max_connections=30']
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    mem_limit: 96m
    command: ['redis-server', '--maxmemory', '64mb', '--maxmemory-policy', 'volatile-lru', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
